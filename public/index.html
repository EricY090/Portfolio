<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Page metadata is static markup and cannot read src/content.js.
      These values must be updated manually when the name or pitch changes.
    -->
    <title>Eric Yang — Software Engineer</title>
    <meta
      name="description"
      content="Software engineer building reliable, high-impact backend systems and data infrastructure. B.S. CS, Stevens Institute of Technology; incoming M.Eng. CS, Cornell University."
    />
    <meta name="author" content="Eric Yang" />
    <!-- Keep in sync with `canvas` in tailwind.config.js. -->
    <meta name="theme-color" content="#0b1120" />

    <!--
      Open Graph / Twitter tags for link previews.

      og:url and og:image MUST be absolute: LinkedIn and Twitter will not
      resolve a relative path against the page they scraped. That hardcodes the
      deployed origin here, so moving to a custom domain is a find-and-replace
      of the occurrences below plus rel="canonical".
    -->
    <link rel="canonical" href="https://ey090.com/" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Eric Yang" />
    <meta property="og:locale" content="en_US" />
    <meta property="og:url" content="https://ey090.com/" />
    <meta property="og:title" content="Eric Yang — Software Engineer" />
    <meta
      property="og:description"
      content="Building reliable, high-impact backend systems and data infrastructure."
    />
    <meta
      property="og:image"
      content="https://ey090.com/og-image.png"
    />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta
      property="og:image:alt"
      content="Eric Yang — Software Engineer. MEng CS @ Cornell '27, BS CS @ Stevens."
    />

    <!-- summary_large_image renders the 1.91:1 card rather than a thumbnail. -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Eric Yang — Software Engineer" />
    <meta
      name="twitter:description"
      content="Building reliable, high-impact backend systems and data infrastructure."
    />
    <meta
      name="twitter:image"
      content="https://ey090.com/og-image.png"
    />

    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to view this page.</noscript>
    <div id="root"></div>
  </body>
</html>
