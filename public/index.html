<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!--
      Page metadata is static markup and cannot read src/content.js.
      These values must be updated manually when the name or pitch changes.
    -->
    <title>Eric Yang — Software Engineer</title>
    <meta
      name="description"
      content="Software engineer building reliable, high-impact backend systems and data infrastructure. B.S. CS, Stevens Institute of Technology; incoming M.Eng. CS, Cornell University."
    />
    <meta name="author" content="Eric Yang" />
    <!-- Keep in sync with `canvas` in tailwind.config.js. -->
    <meta name="theme-color" content="#0b1120" />

    <!-- Open Graph tags for link previews.
         TODO: once deployed, set og:url to the canonical URL and add an
         og:image (1200x630 PNG in public/) so shared links render a card. -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Eric Yang — Software Engineer" />
    <meta
      property="og:description"
      content="Building reliable, high-impact backend systems and data infrastructure."
    />
    <meta name="twitter:card" content="summary" />

    <link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/favicon.svg" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <noscript>You need to enable JavaScript to view this page.</noscript>
    <div id="root"></div>
  </body>
</html>
